[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai6103-dog-breed"
version = "0.1.0"
description = "Reproducible EfficientNetV2-S experiments for AI6103"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26,<2",
  "Pillow>=10.0",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "gdown>=5.2",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
